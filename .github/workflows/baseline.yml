name: Baseline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Python ${{ matrix.python-version }}
    # Keep SDL/Pygame on a known-compatible runner; ubuntu-latest migrated to 26.04.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONIOENCODING: utf-8

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile sources
        run: python -m compileall -q .

      - name: Run baseline test suite
        run: python -m coverage run -m unittest discover -s tests -v

      - name: Enforce coverage floor
        run: python -m coverage report -m --fail-under=30

      - name: Run sanity checks
        run: python tools_test_sanity.py

      - name: Run GUI smoke test
        run: python tools_test_gui.py
